<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSP Traders · Premium Agricultural Produce · Madurai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       SSP TRADERS · HANDCRAFTED DARK THEME
       Principal Developer: Agricultural E-Commerce
       ============================================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0a0f0d;
      --bg-card: #111916;
      --bg-elevated: #182420;
      --bg-hover: #1e2e28;
      --border-subtle: #243830;
      --border-active: #2d6a4f;
      --green-primary: #2d6a4f;
      --green-bright: #40916c;
      --green-glow: #52b788;
      --terracotta: #e07a5f;
      --terracotta-soft: #d1684a;
      --cream: #f4f1de;
      --text-primary: #e8ede9;
      --text-secondary: #9bb0a4;
      --text-muted: #6b8078;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-active);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--green-bright);
    }

    h1, h2, h3, h4, .brand-name, .btn, .badge, .price, .cart-total, .calc-result {
      font-family: 'Outfit', sans-serif;
    }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      text-decoration: none;
      color: inherit;
      font-family: 'Outfit', sans-serif;
    }

    .btn-primary {
      background: var(--green-primary);
      color: white;
      box-shadow: 0 4px 16px rgba(45, 106, 79, 0.3);
    }
    .btn-primary:hover {
      background: var(--green-bright);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45, 106, 79, 0.4);
    }

    .btn-wa {
      background: #25D366;
      color: #0a0f0d;
      font-weight: 800;
    }
    .btn-wa:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.3);
    }

    .btn-outline {
      border: 1.5px solid var(--border-active);
      color: var(--green-glow);
      background: transparent;
    }
    .btn-outline:hover {
      background: rgba(45, 106, 79, 0.15);
      border-color: var(--green-bright);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ========== ANNOUNCEMENT ========== */
    .announcement {
      background: linear-gradient(90deg, #0d1f17 0%, #132a1f 50%, #0d1f17 100%);
      color: var(--cream);
      padding: 11px 20px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border-subtle);
      letter-spacing: 0.2px;
    }

    /* ========== HEADER ========== */
    .header {
      background: rgba(10, 15, 13, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--green-primary), var(--green-bright));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(45, 106, 79, 0.4);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    .brand-text h1 {
      font-size: 1.45rem;
      font-weight: 900;
      color: white;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .brand-text span {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      transition: color 0.2s;
      position: relative;
      padding: 4px 0;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--terracotta);
      transition: width 0.25s ease;
      border-radius: 2px;
    }

    .nav-links a:hover {
      color: white;
    }
    .nav-links a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ========== MODE TOGGLE (HEADER) ========== */
    .mode-toggle-header {
      display: flex;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 4px;
      position: relative;
    }

    .mode-btn {
      padding: 8px 18px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.72rem;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .mode-btn.active {
      background: var(--green-primary);
      color: white;
      box-shadow: 0 2px 10px rgba(45, 106, 79, 0.4);
    }

    .mode-btn:not(.active):hover {
      color: var(--text-secondary);
    }

    /* ========== CART BUTTON ========== */
    .cart-btn {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
    }

    .cart-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
    }

    .cart-btn svg {
      stroke: var(--green-glow);
    }

    .cart-count {
      background: var(--terracotta);
      color: white;
      border-radius: 30px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }

    /* ========== RUNNING MODE TICKER ========== */
    .running-mode-bar {
      background: linear-gradient(90deg, #132a1f 0%, #1a3d2e 50%, #132a1f 100%);
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
      padding: 9px 0;
      position: relative;
    }

    .running-mode-bar::before,
    .running-mode-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      z-index: 2;
      pointer-events: none;
    }

    .running-mode-bar::before {
      left: 0;
      background: linear-gradient(90deg, #132a1f, transparent);
    }

    .running-mode-bar::after {
      right: 0;
      background: linear-gradient(270deg, #132a1f, transparent);
    }

    .ticker-track {
      display: flex;
      animation: tickerScroll 28s linear infinite;
      width: max-content;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 32px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      color: var(--cream);
    }

    .ticker-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--terracotta);
      box-shadow: 0 0 8px var(--terracotta);
      animation: pulseDot 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .ticker-highlight {
      color: var(--green-glow);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.5px;
    }

    .ticker-sep {
      color: var(--text-muted);
      opacity: 0.4;
      margin: 0 4px;
    }

    /* ========== HERO ========== */
    .hero {
      padding: 70px 0 50px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -150px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(45, 106, 79, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -250px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(224, 122, 95, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-content {
      max-width: 820px;
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(45, 106, 79, 0.2);
      border: 1px solid var(--border-active);
      border-radius: 50px;
      padding: 7px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green-glow);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    .hero-eyebrow span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-glow);
      box-shadow: 0 0 8px var(--green-glow);
    }

    .hero h2 {
      font-size: 3.4rem;
      font-weight: 900;
      color: white;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero h2 em {
      font-style: normal;
      color: var(--green-glow);
      position: relative;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 500;
      max-width: 680px;
      line-height: 1.7;
    }

    .trust-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-bottom: 36px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.88rem;
    }

    .trust-badges span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trust-badges svg {
      width: 18px;
      height: 18px;
      stroke: var(--green-glow);
      stroke-width: 2.5;
      fill: none;
      flex-shrink: 0;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    /* ========== LIVE PRICING BANNER ========== */
    .pricing-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      margin: 20px 0 40px;
      padding: 16px 26px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .pricing-banner p {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pricing-banner p svg {
      stroke: var(--terracotta);
      fill: none;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .mode-switch-large {
      display: flex;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 5px;
      border-radius: 14px;
    }

    .mode-switch-large button {
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
      color: var(--text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .mode-switch-large button.active {
      background: var(--green-primary);
      color: white;
      box-shadow: 0 3px 12px rgba(45, 106, 79, 0.4);
    }

    .mode-switch-large button:not(.active):hover {
      color: var(--text-secondary);
    }

    /* ========== SECTION HEADERS ========== */
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
    }

    .section-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* ========== FILTER BAR ========== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 28px;
    }

    .filter-btn {
      padding: 10px 22px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .filter-btn.active {
      background: var(--green-primary);
      color: white;
      border-color: var(--green-primary);
      box-shadow: 0 4px 14px rgba(45, 106, 79, 0.35);
    }

    .filter-btn:not(.active):hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    /* ========== PRODUCT GRID ========== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
      margin: 0 0 60px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.4, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-active);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(45, 106, 79, 0.2);
    }

    .card-img {
      position: relative;
      overflow: hidden;
      height: 200px;
      background: var(--bg-elevated);
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
      display: block;
      filter: brightness(0.95);
    }

    .product-card:hover .card-img img {
      transform: scale(1.08);
      filter: brightness(1.05);
    }

    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(10, 15, 13, 0.6) 100%);
      pointer-events: none;
    }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--terracotta);
      color: white;
      font-weight: 800;
      font-size: 0.62rem;
      padding: 5px 12px;
      border-radius: 8px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(224, 122, 95, 0.4);
      z-index: 2;
    }

    .card-content {
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: white;
      margin-bottom: 3px;
      letter-spacing: -0.01em;
    }

    .tamil-name {
      font-size: 0.7rem;
      color: var(--terracotta);
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .price {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--green-glow);
      letter-spacing: -0.02em;
    }

    .price-unit {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .qty-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
    }

    .qty-btn:hover {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: white;
    }

    .qty-value {
      font-weight: 800;
      min-width: 40px;
      text-align: center;
      font-size: 0.95rem;
      color: white;
    }

    .unit-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-left: auto;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .add-btn {
      flex: 1;
      background: var(--green-primary);
      color: white;
      border: none;
      padding: 12px 0;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .add-btn:hover {
      background: var(--green-bright);
      box-shadow: 0 6px 18px rgba(45, 106, 79, 0.4);
    }

    .add-btn svg {
      width: 16px;
      height: 16px;
      stroke: white;
      fill: none;
      stroke-width: 2.5;
    }

    /* ========== WHOLESALE CALCULATOR ========== */
    .calc-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 42px;
      margin: 0 0 60px;
      position: relative;
      overflow: hidden;
    }

    .calc-section::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(45, 106, 79, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .calc-section .section-title {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .calc-section > p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .calc-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
      margin-top: 24px;
      position: relative;
      z-index: 1;
    }

    .calc-field {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .calc-field label {
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .calc-field select,
    .calc-field input {
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: border-color 0.2s;
      font-weight: 600;
    }

    .calc-field select:focus,
    .calc-field input:focus {
      outline: none;
      border-color: var(--green-bright);
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
    }

    .calc-result {
      font-weight: 900;
      font-size: 2rem;
      color: var(--green-glow);
      margin-top: 20px;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    .calc-result span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-left: 8px;
      letter-spacing: 0.3px;
    }

    /* ========== WHY US ========== */
    .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
      margin: 0 0 70px;
    }

    .why-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 30px 24px;
      border-radius: 18px;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .why-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--green-primary), var(--green-glow));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .why-card:hover {
      border-color: var(--border-active);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .why-card:hover::before {
      opacity: 1;
    }

    .why-icon {
      width: 52px;
      height: 52px;
      background: rgba(45, 106, 79, 0.15);
      border: 1px solid var(--border-active);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .why-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--green-glow);
      stroke-width: 1.8;
      fill: none;
    }

    .why-card h4 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: white;
      font-weight: 800;
    }

    .why-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ========== CART DRAWER ========== */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -440px;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
      transition: right 0.35s cubic-bezier(0.2, 0.8, 0.4, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 18px;
      margin-bottom: 18px;
    }

    .cart-header h3 {
      font-size: 1.4rem;
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-header h3 svg {
      width: 22px;
      height: 22px;
      stroke: var(--green-glow);
      fill: none;
      stroke-width: 2;
    }

    .close-cart {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.3rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .close-cart:hover {
      background: var(--terracotta);
      color: white;
      border-color: var(--terracotta);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 120px;
    }

    .cart-item {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-img {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }

    .cart-item-info {
      flex: 1;

    }

    .cart-item-name {

      font-size: 0.88rem;
      color: white;
      margin-bottom: 2px;
    }

    .cart-item-price {
      font-weight: 700;
      color: var(--green-glow);
      font-size: 0.85rem;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .cart-item-qty button {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .cart-item-qty button:hover {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: white;
    }

    .cart-item-qty span {
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 24px;
      text-align: center;
    }

    .cart-remove {
      color: var(--terracotta);
      font-size: 0.7rem;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 700;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.15s;
    }

    .cart-remove:hover {
      color: #ff6b4a;
    }
