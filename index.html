<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSP Traders — Premium Fresh Produce | Madurai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== DARK THEME RESET & ROOT ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --forest: #0d1f17;
      --forest-2: #132a1f;
      --farm: #1e4a35;
      --farm-2: #2a6b4a;
      --moss: #3d8b63;
      --tan: #e8e2d0;
      --tan-dim: #b8b3a0;
      --terracotta: #e07a5f;
      --terracotta-2: #c96a52;
      --slate: #1a1c2a;
      --slate-2: #24263a;
      --slate-3: #2e3048;
      --text: #e8e2d0;
      --text-dim: #9a9c8f;
      --border: #2a3a30;
      --border-2: #3a4a40;
      --card-bg: #15251c;
      --card-hover: #1b3025;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.6);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;
      --transition: all 0.25s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--forest);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      line-height: 1.2;
      color: var(--tan);
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    img { max-width: 100%; display: block; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--forest-2); }
    ::-webkit-scrollbar-thumb { background: var(--farm-2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--moss); }

    /* ===== ANNOUNCEMENT BAR (RUNNING MODE) ===== */
    .announcement-bar {
      background: var(--slate);
      color: var(--terracotta);
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    .announcement-track {
      display: inline-block;
      animation: scrollLeft 30s linear infinite;
      padding-left: 100%;
    }

    .announcement-track span {
      margin-right: 4rem;
      display: inline-block;
    }

    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* ===== STICKY HEADER ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: rgba(13, 31, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .logo-badge {
      background: var(--terracotta);
      color: var(--forest);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--tan);
      line-height: 1;
    }

    .logo-text small {
      display: block;
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--moss);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .nav-links a {
      transition: var(--transition);
      position: relative;
      color: var(--text-dim);
      cursor: pointer;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--terracotta); }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--terracotta);
      transition: var(--transition);
    }

    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .mode-toggle {
      display: flex;
      align-items: center;
      background: var(--slate-2);
      border-radius: 30px;
      padding: 3px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .mode-btn {
      padding: 6px 12px;
      border-radius: 30px;
      transition: var(--transition);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .mode-btn.active {
      background: var(--farm-2);
      color: var(--tan);
    }

    .cart-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--farm-2);
      color: var(--tan);
      transition: var(--transition);
    }

    .cart-btn:hover { background: var(--moss); transform: scale(1.05); }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--terracotta);
      color: var(--forest);
      font-size: 0.7rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--forest);
    }

    /* ===== PAGE SYSTEM ===== */
    .page { display: none; animation: fadeIn 0.4s ease; }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== HERO SECTION ===== */
    .hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 60px 24px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .hero-content h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero-content h1 span { color: var(--terracotta); }

    .hero-content p {
      font-size: 1.05rem;
      color: var(--text-dim);
      margin-bottom: 28px;
      max-width: 520px;
    }

    .trust-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 32px;
    }

    .trust-badges span {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--moss);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trust-badges span::before {
      content: '✓';
      color: var(--terracotta);
      font-weight: 800;
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition);
      letter-spacing: 0.2px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--terracotta);
      color: var(--forest);
      box-shadow: 0 8px 20px rgba(224, 122, 95, 0.25);
    }

    .btn-primary:hover { background: var(--terracotta-2); transform: translateY(-2px); }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--farm-2);
      color: var(--tan);
    }

    .btn-outline:hover { background: var(--farm-2); transform: translateY(-2px); }

    .btn-whatsapp {
      background: #25D366;
      color: #0d1f17;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
    }

    .btn-whatsapp:hover { background: #1da851; transform: translateY(-2px); }

    .hero-image {
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      aspect-ratio: 4/3;
      background: var(--slate-2);
      border: 1px solid var(--border);
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
    }

    /* ===== LIVE PRICING BANNER ===== */
    .pricing-banner {
      background: var(--forest-2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 22px 0;
    }

    .pricing-banner-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pricing-banner h3 {
      font-size: 1.1rem;
      color: var(--tan);
    }

    .pricing-banner h3 small {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--moss);
      margin-top: 2px;
    }

    .mode-selector-lg {
      display: flex;
      background: var(--slate-2);
      border-radius: 40px;
      padding: 4px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .mode-selector-lg button {
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition);
      color: var(--text-dim);
    }

    .mode-selector-lg button.active {
      background: var(--farm-2);
      color: var(--tan);
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
      max-width: 1280px;
      margin: 0 auto;
      padding: 50px 24px 20px;
      text-align: center;
    }

    .page-header h2 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-dim);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ===== PRODUCT CATALOG ===== */
    .catalog {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .category-filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }

    .filter-btn {
      padding: 10px 22px;
      border-radius: 40px;
      background: var(--slate-2);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      color: var(--text-dim);
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--farm-2);
      color: var(--tan);
      border-color: var(--farm-2);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 26px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--farm-2);
      background: var(--card-hover);
    }

    .product-image {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1/1;
      background: var(--slate-2);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image img { transform: scale(1.08); }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--terracotta);
      color: var(--forest);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 30px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .product-badge.bestseller { background: var(--moss); color: var(--forest); }
    .product-badge.bulk { background: #d4a93c; color: var(--forest); }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: var(--tan);
    }

    .product-tamil {
      font-size: 0.78rem;
      color: var(--moss);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .product-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      margin-top: auto;
    }

    .price-display {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--terracotta);
    }

    .price-display small {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-dim);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .unit-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--tan-dim);
      background: var(--slate-2);
      padding: 3px 10px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .qty-selector {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--slate-2);
    }

    .qty-selector button {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--tan);
      background: transparent;
      transition: var(--transition);
    }

    .qty-selector button:hover { background: var(--farm-2); }

    .qty-selector input {
      width: 44px;
      text-align: center;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--tan);
      background: transparent;
      padding: 8px 0;
      outline: none;
    }

    .add-to-order {
      width: 100%;
      padding: 11px;
      background: var(--farm-2);
      color: var(--tan);
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition);
      letter-spacing: 0.3px;
    }

    .add-to-order:hover { background: var(--moss); color: var(--forest); }

    /* ===== WHOLESALE CALCULATOR ===== */
    .calculator-section {
      background: var(--forest-2);
      padding: 60px 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .calculator-inner {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .calculator-inner h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .calculator-inner > p {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 32px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    .calc-field label {
      display: block;
      font-weight: 600;
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: var(--moss);
    }

    .calc-field select, .calc-field input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--tan);
      background: var(--slate-2);
      outline: none;
      transition: var(--transition);
    }

    .calc-field select:focus, .calc-field input:focus {
      border-color: var(--moss);
      box-shadow: 0 0 0 3px rgba(61, 139, 99, 0.15);
    }

    .calc-result {
      background: var(--farm);
      color: var(--tan);
      padding: 24px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border: 1px solid var(--farm-2);
    }

    .calc-result .label { font-size: 0.85rem; opacity: 0.8; }
    .calc-result .value { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--terracotta); }

    /* ===== WHY CHOOSE ===== */
    .why-us {
      max-width: 1280px;
      margin: 0 auto;
      padding: 70px 24px;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 26px;
      margin-top: 48px;
    }

    .why-card {
      background: var(--card-bg);
      padding: 30px 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      text-align: center;
    }

    .why-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--farm-2);
      background: var(--card-hover);
    }

    .why-icon {
      width: 58px;
      height: 58px;
      background: var(--slate-2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 1.5rem;
      border: 1px solid var(--border);
    }

    .why-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--tan);
    }

    .why-card p {
      font-size: 0.88rem;
      color: var(--text-dim);
    }

    /* ===== CONTACT PAGE ===== */
    .contact-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .contact-info h3 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    .contact-info p {
      color: var(--text-dim);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .contact-detail {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .contact-detail .icon {
      width: 44px;
      height: 44px;
      background: var(--slate-2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
      border: 1px solid var(--border);
    }

    .contact-detail h4 {
      font-size: 0.95rem;
      margin-bottom: 2px;
      color: var(--tan);
    }

    .contact-detail p {
      font-size: 0.88rem;
      color: var(--text-dim);
      margin: 0;
    }

    .contact-form {
      background: var(--card-bg);
      padding: 32px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .contact-form h3 {
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: var(--moss);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--tan);
      background: var(--slate-2);
      outline: none;
      transition: var(--transition);
      resize: vertical;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--moss);
      box-shadow: 0 0 0 3px rgba(61, 139, 99, 0.15);
    }

    /* ===== CART DRAWER ===== */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1100;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .cart-overlay.open { opacity: 1; visibility: visible; }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 420px;
      max-width: 92vw;
      background: var(--forest-2);
      z-index: 1200;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      border-left: 1px solid var(--border);
    }

    .cart-drawer.open { transform: translateX(0); }

    .cart-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--forest);
    }

    .cart-header h3 { font-size: 1.2rem; }

    .cart-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--slate-2);
      color: var(--tan);
      font-size: 1.1rem;
      transition: var(--transition);
      border: 1px solid var(--border);
    }

    .cart-close:hover { background: var(--terracotta); color: var(--forest); }

    .cart-items {
      flex-grow: 1;

    .cart-empty {

      align-items: center;
    }

    .cart-item-img {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);

      border: 1px solid var(--border);

    .cart-item-price {
      font-weight: 700;
      color: var(--terracotta);
      font-size: 0.9rem;

    .cart-item-remove {

      transition: var(--transition);

    .cart-item-remove:hover { color: var(--terracotta); }

    .cart-footer {

      background: var(--forest);

    .order-type-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;

    .order-type-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.82rem;
      transition: var(--transition);
      background: var(--slate-2);
      color: var(--text-dim);
    }

    .order-type-btn.active {
      background: var(--farm-2);
      color: var(--tan);
      border-color: var(--farm-2);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .cart-total .total-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--terracotta);
    }

    .whatsapp-order-btn {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: #0d1f17;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .whatsapp-order-btn:hover { background: #1da851; }

    .whatsapp-order-btn:disabled {
      background: var(--slate-2);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* ===== FOOTER ===== */
    .footer {
      background: var(--forest-2);
      color: var(--text-dim);
      padding: 60px 24px 20px;
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 48px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }

    .footer h4 {
      color: var(--tan);
      font-size: 1.05rem;
      margin-bottom: 16px;
    }

    .footer p, .footer li {
      font-size: 0.88rem;
      line-height: 1.8;
    }

    .footer ul { list-style: none; }
    .footer ul li { margin-bottom: 6px; }
    .footer ul li a { cursor: pointer; transition: var(--transition); }
    .footer ul li a:hover { color: var(--terracotta); }

    .footer-bottom {
      max-width: 1280px;
      margin: 0 auto;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.78rem;
    }

    /* ===== TOAST NOTIFICATION ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--farm-2);
      color: var(--tan);
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      opacity: 0;
      transition: all 0.4s ease;
      border: 1px solid var(--moss);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

      .logo-text { font-size: 1.1rem; }
